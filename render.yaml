services:
  - type: web
    name: memory-flow
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run preview
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVER_SECRET
        generateValue: true
      - key: ADMIN_PASSPHRASE
        value: admin123
      - key: DEFAULT_VISITOR_PASSWORD
        value: elevate2026
